plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.1' apply false
    id 'io.spring.dependency-management' version '1.1.5' apply false
}

allprojects {
    group = 'practice'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

project(':projecth-domain') {
    bootJar { enabled = false }
    jar { enabled = true }
    
    dependencies {
        // 순수 자바 모듈로 유지
    }
}

project(':projecth-application') {
    bootJar { enabled = false }
    jar { enabled = true }

    dependencies {
        implementation project(':projecth-domain')
        implementation 'org.springframework.boot:spring-boot-starter'
        implementation 'org.springframework:spring-tx'
    }
}

project(':projecth-infrastructure') {
    bootJar { enabled = false }
    jar { enabled = true }

    dependencies {
        implementation project(':projecth-application')
        implementation project(':projecth-domain')
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
        runtimeOnly 'com.h2database:h2'
    }
}

project(':projecth-api') {
    bootJar { enabled = true }
    jar { enabled = false }

    dependencies {
        implementation project(':projecth-application')
        implementation project(':projecth-infrastructure')
        implementation project(':projecth-domain')
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    }
}

